{{ define "main" }}
<section class="page-hero">
  <div class="page-hero-bg">
    {{ with $.Site.Params.heroImage }}<img src="{{ . }}" alt="{{ $.Site.Title }}" loading="eager">{{ end }}
  </div>
  <div class="page-hero-overlay"></div>
  <div class="page-hero-content">
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="page-hero-subtitle">{{ . }}</p>{{ end }}
  </div>
</section>
<section class="pw-plain" style="padding:4rem 1.5rem;">
  <div style="max-width:820px;margin:0 auto;line-height:1.7;">
    {{ .Content }}
  </div>
</section>
{{ end }}
